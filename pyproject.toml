[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aris-harness-controller"
version = "0.2.0"
description = "Deterministic Controller, validators, and gateways for formal ARIS research-lit runs"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["arisctl*", "tools*"]
namespaces = true
